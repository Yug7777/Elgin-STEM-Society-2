<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minecraft-Inspired Builder</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Browser Sandbox</p>
        <h1>Minecraft-Inspired Builder</h1>
      </div>
      <div class="actions">
        <button id="resetBtn">Reset World</button>
        <button id="saveBtn">Save World</button>
      </div>
    </header>

    <main class="game-panel">
      <canvas id="gameCanvas" width="960" height="540"></canvas>
      <div class="hud">
        <div id="inventory" class="inventory"></div>
        <div class="status-card">
          <p><strong>Controls:</strong> WASD or arrow keys to move • Left click to break • Right click to place • 1-8 to switch blocks</p>
          <p><strong>Goal:</strong> Mine blocks, build a base, and save your world in your browser.</p>
        </div>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
